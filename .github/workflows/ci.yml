name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # No chess engines here: the tests that need one are skipped.
      - run: python -m pytest -q tests

  cards-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cards_app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cards_app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: python3 -m unittest
        working-directory: cards_app/tools
